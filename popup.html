<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浮岛书签</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body class="popup">
  <div class="scene" id="scene" aria-hidden="true"></div>
  <main class="pp">
    <header class="pp-head">
      <span class="pp-mark" id="mark"></span>
      <div class="pp-title">
        <b>浮岛书签</b>
        <small id="stats">正在读取书签…</small>
      </div>
    </header>

    <label class="pp-search glass">
      <span id="searchIc" aria-hidden="true"></span>
      <input id="q" type="search" placeholder="搜索书签" autocomplete="off" aria-label="搜索书签" autofocus>
    </label>

    <section class="pp-list glass" aria-live="polite">
      <h2 class="pp-label" id="listLabel">最近添加</h2>
      <div id="list"></div>
    </section>

    <div class="pp-actions">
      <button class="btn btn-mint" id="openApp"></button>
      <button class="btn" id="openMgr" title="打开 Chrome 自带的书签管理器"></button>
    </div>
  </main>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
